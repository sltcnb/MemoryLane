name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest ruff
      - name: Install libewf (interop cross-check)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ewf-tools
      - run: ruff check memorylane tests
      - run: pytest -q
