name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Pinned: an unpinned ruff changes what CI enforces without a commit.
      - run: pip install pytest 'ruff==0.16.3'
      - name: Install libewf (interop cross-check)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ewf-tools
      - run: ruff check memorylane tests
      - run: pytest -q
      # Windows has no os.pread; the package falls back to a locked seek+read.
      # Force that path here so it is covered on every platform, not only by
      # the Windows jobs.
      - name: Tests with the Windows read path forced
        if: runner.os != 'Windows'
        env:
          MEMORYLANE_NO_PREAD: '1'
        run: pytest -q
